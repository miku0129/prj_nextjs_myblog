services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_graphql_todolist
    depends_on:
      db:
        condition: service_healthy
    environment:
      - VPS_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}?schema=public
    ports:
      - "4000:3000"
    volumes:
      - .:/app:cached
      - prj_nextjs_graphql_todolist_node_modules:/app/node_modules
    networks: 
      - nextjs_graphql_todolist-net
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: 
      - nextjs_graphql_todolist-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      retries: 5

volumes:
  pgdata:
    driver: local
  prj_nextjs_graphql_todolist_node_modules:

networks:
  nextjs_graphql_todolist-net:
    driver: bridge
