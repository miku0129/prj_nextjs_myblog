name: Automate creating a Github Issue 
run-name: ${{ github.actor }} is testing out GitHub Actions
permissions:
  issues: write  # Issue作成のみの権限を付与
  contents: read # リポジトリの読み取り権限
on: 
  repository_dispatch:
    types: ["error_detect"]

jobs:
  create-issue:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Issue の作成
        run: |
          cat << 'EOF' | gh issue create --label "Automation test" --body-file -
          ## 今日やること
          - [ ] 今日やることを書く

          ## 学んだこと
          - 

          ## ネクストアクション
          - 
          EOF
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}